[project]
name = "arxiv-reproducer-agent"
version = "0.1.0"
description = "A multi-agent system for reproducing arXiv papers using LLMs."
readme = "README.md"
authors = [{ name = "Maurice Yang", email = "mauriceyangmy28@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "docling>=2.124.0",
    "docling-core[chunking]>=2.93.0",
    "fastembed>=0.8.0",
    "langchain>=1.3.18",
    "langchain-docling>=3.0.0",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
arxiv-reproducer-agent = "arxiv_reproducer_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
