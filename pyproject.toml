[project]
name = "arxiv-reproducer-agent"
version = "0.1.0"
description = "A multi-agent system for reproducing arXiv papers using LLMs."
readme = "README.md"
authors = [{ name = "Maurice Yang", email = "mauriceyangmy28@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "deepagents>=0.7.13",
    "deepeval>=4.2.2",
    "docling>=2.124.0",
    "docling-core[chunking]>=2.93.0",
    "fastapi[standard]>=0.141.1",
    "fastembed>=0.8.0",
    "instructor>=1.17.0",
    "langchain>=1.3.18",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-docling>=3.0.0",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "laya>=0.3.5",
    "lm-format-enforcer>=0.11.3",
    "ollama>=0.6.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "ruff>=0.16.6",
    "sentence-transformers>=6.0.1",
    "transformers[torch]>=5.17.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
arxiv-reproducer-agent = "arxiv_reproducer_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
