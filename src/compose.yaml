version: "3.8"

services:
  qdrant-db:
    image: qdrant/qdrant:v1.17.1
    container_name: arxiv_codegen_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP Web UI & REST API
      - "6334:6334"  # gRPC (Good for fast backend operations)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3

